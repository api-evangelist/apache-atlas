naftiko: 1.0.0-alpha2
info:
  label: Apache Atlas REST API — Relationships
  description: 'Apache Atlas REST API — Relationships. 1 operations. Lead operation: Apache Atlas Create Relationship. Self-contained
    Naftiko capability covering one Apache Atlas business surface.'
  tags:
  - Apache Atlas
  - Relationships
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    APACHE_ATLAS_API_KEY: APACHE_ATLAS_API_KEY
capability:
  consumes:
  - type: http
    namespace: rest-relationships
    baseUri: http://localhost:21000/api/atlas
    description: Apache Atlas REST API — Relationships business capability. Self-contained, no shared references.
    resources:
    - name: v2-relationship
      path: /v2/relationship
      operations:
      - name: createrelationship
        method: POST
        description: Apache Atlas Create Relationship
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: basic
      username: '{{env.APACHE_ATLAS_USER}}'
      password: '{{env.APACHE_ATLAS_PASS}}'
  exposes:
  - type: rest
    namespace: rest-relationships-rest
    port: 8080
    description: REST adapter for Apache Atlas REST API — Relationships. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/v2/relationship
      name: v2-relationship
      description: REST surface for v2-relationship.
      operations:
      - method: POST
        name: createrelationship
        description: Apache Atlas Create Relationship
        call: rest-relationships.createrelationship
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: rest-relationships-mcp
    port: 9090
    transport: http
    description: MCP adapter for Apache Atlas REST API — Relationships. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: apache-atlas-create-relationship
      description: Apache Atlas Create Relationship
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: rest-relationships.createrelationship
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
