naftiko: 1.0.0-alpha2
info:
  label: Apache Atlas Data Governance
  description: Unified capability for Apache Atlas data governance workflows including metadata discovery, lineage tracking,
    entity management, and glossary management. Used by data governance teams and data engineers.
  tags:
  - Apache Atlas
  - Data Governance
  - Metadata Management
  - Data Lineage
  - Compliance
  created: '2026-04-19'
  modified: '2026-05-06'
binds:
- namespace: env
  keys:
    ATLAS_USERNAME: ATLAS_USERNAME
    ATLAS_PASSWORD: ATLAS_PASSWORD
capability:
  consumes:
  - type: http
    namespace: atlas-rest
    baseUri: http://localhost:21000/api/atlas
    description: Apache Atlas REST API.
    authentication:
      type: basic
      username: '{{ATLAS_USERNAME}}'
      password: '{{ATLAS_PASSWORD}}'
    resources:
    - name: entities
      path: /v2/entity
      description: Manage metadata entities.
      operations:
      - name: get-entity
        method: GET
        description: Get entity by GUID.
        inputParameters:
        - name: guid
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-entities
        method: POST
        description: Create or update entities in bulk.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: delete-entity
        method: DELETE
        description: Delete entity by GUID.
        inputParameters:
        - name: guid
          in: path
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: search
      path: /v2/search
      description: Search and discover metadata.
      operations:
      - name: basic-search
        method: GET
        description: Search entities by type and attributes.
        inputParameters:
        - name: typeName
          in: query
          type: string
          required: false
        - name: query
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: fulltext-search
        method: GET
        description: Full-text search across all entities.
        inputParameters:
        - name: query
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: lineage
      path: /v2/lineage
      description: Retrieve entity lineage.
      operations:
      - name: get-lineage
        method: GET
        description: Get lineage for an entity.
        inputParameters:
        - name: guid
          in: path
          type: string
          required: true
        - name: direction
          in: query
          type: string
          required: false
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: glossary
      path: /v2/glossary
      description: Manage business glossary.
      operations:
      - name: list-glossaries
        method: GET
        description: List all glossaries.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: create-glossary
        method: POST
        description: Create a glossary.
        inputParameters: []
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: atlas-governance-api
    description: Unified REST API for Atlas data governance.
    resources:
    - path: /v1/entities/{guid}
      name: entities
      operations:
      - method: GET
        name: get-entity
        description: Get entity.
        call: atlas-rest.get-entity
        with:
          guid: rest.guid
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/search
      name: search
      operations:
      - method: GET
        name: search-entities
        description: Search entities.
        call: atlas-rest.basic-search
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/lineage/{guid}
      name: lineage
      operations:
      - method: GET
        name: get-lineage
        description: Get entity lineage.
        call: atlas-rest.get-lineage
        with:
          guid: rest.guid
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: atlas-governance-mcp
    transport: http
    description: MCP server for AI-assisted data governance with Apache Atlas.
    tools:
    - name: get-entity
      description: Get an Atlas entity by GUID.
      hints:
        readOnly: true
      call: atlas-rest.get-entity
      with:
        guid: tools.guid
      outputParameters:
      - type: object
        mapping: $.
    - name: search-entities
      description: Search Atlas metadata entities by type and attributes.
      hints:
        readOnly: true
      call: atlas-rest.basic-search
      with:
        typeName: tools.typeName
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
    - name: fulltext-search
      description: Full-text search across all Atlas metadata.
      hints:
        readOnly: true
      call: atlas-rest.fulltext-search
      with:
        query: tools.query
      outputParameters:
      - type: object
        mapping: $.
    - name: get-lineage
      description: Get data lineage graph for an Atlas entity.
      hints:
        readOnly: true
      call: atlas-rest.get-lineage
      with:
        guid: tools.guid
        direction: tools.direction
      outputParameters:
      - type: object
        mapping: $.
    - name: create-entities
      description: Create metadata entities in Atlas for data governance.
      hints:
        readOnly: false
      call: atlas-rest.create-entities
      outputParameters:
      - type: object
        mapping: $.
    - name: list-glossaries
      description: List business glossaries for data governance.
      hints:
        readOnly: true
      call: atlas-rest.list-glossaries
      outputParameters:
      - type: object
        mapping: $.
