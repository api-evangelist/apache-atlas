aid: apache-atlas
name: Apache Atlas
description: Apache Atlas is a scalable and extensible set of core foundational data governance services developed by the
  Apache Software Foundation. It enables enterprises to effectively meet their compliance requirements within Hadoop and allows
  integration with the whole enterprise data ecosystem. Atlas provides metadata management, data classification, lineage tracking,
  business glossary, and a REST API for programmatic governance operations. It supports discovery, auditing, and policy management
  for enterprise data assets.
